name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install homeassistant==2026.8.2 pytest pytest-asyncio
      - run: python -m pytest -q

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled login instructions
        run: python3 -m unittest discover -s tests -p test_translations.py -v

  test_release:
    name: Publish appointment investigation prerelease
    needs: [tests, hacs, hassfest, translations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta/appointment-types-0.11.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish test build for HACS
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          version="$(jq -r '.version' custom_components/somtoday/manifest.json)"
          if [[ "$version" != "0.11.1-beta.2" ]]; then
            echo "Unexpected test version"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Prerelease already exists"
          else
            gh release create "$tag" \
              --target "$TARGET_SHA" \
              --title "$tag — Appointment type investigation" \
              --prerelease --latest=false \
              --notes-file "docs/releases/$tag.md"
          fi
